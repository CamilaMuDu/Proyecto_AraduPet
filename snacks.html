<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snacks | Aradu Pet</title>

    <link rel="stylesheet" href="css/snacks.css">

</head>

<body>

    <!-- =====================================
     BOTÓN FLOTANTE REGRESAR AL INICIO
====================================== -->

    <a href="index.html" class="boton-volver-flotante" aria-label="Regresar al inicio" title="Regresar al inicio">

        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>

        </svg>
    </a>

    <main>

        <section class="catalogo-snacks">

            <div class="catalogo-contenedor">

                <!--------------------------------
                       ENCABEZADO
                --------------------------------->

                <div class="catalogo-encabezado">

                    <h1 class="catalogo-titulo">
                        Snacks
                    </h1>

                    <p class="catalogo-subtitulo">
                        Encuentra premios y bocadillos para consentir a tu mascota.
                    </p>

                </div>

                <!--------------------------------
                       HERRAMIENTAS
                --------------------------------->

                <div class="catalogo-herramientas">

                    <button type="button" class="boton-abrir-filtros" id="abrirFiltros">

                        Filtros

                    </button>

                    <div class="herramientas-derecha">

                        <p class="cantidad-productos" id="cantidadProductos">

                            5 snacks

                        </p>

                        <select class="ordenar-productos" id="ordenarProductos" aria-label="Ordenar snacks">

                            <option value="original">
                                Orden predeterminado
                            </option>

                            <option value="az">
                                Alfabéticamente, A-Z
                            </option>

                            <option value="za">
                                Alfabéticamente, Z-A
                            </option>

                        </select>

                    </div>

                </div>


                <!-- ================================
        PANEL DE FILTROS
================================= -->

                <aside class="panel-filtros" id="panelFiltros">

                    <div class="panel-filtros-encabezado">

                        <div>

                            <h2>
                                Filtrar snacks
                            </h2>

                            <p>
                                Encuentra lo que necesitas
                            </p>

                        </div>

                        <button type="button" class="boton-cerrar-filtros" id="cerrarFiltros"
                            aria-label="Cerrar filtros">

                            &times;

                        </button>

                    </div>


                    <div class="filtros-contenido">


                        <!-- ==========================
                MASCOTA
        =========================== -->

                        <div class="grupo-filtro">

                            <h3>
                                Mascota
                            </h3>


                            <label class="filtro-opcion">

                                <input type="checkbox" value="perro" class="filtro-mascota">

                                <span>
                                    Perro
                                </span>

                            </label>


                            <label class="filtro-opcion">

                                <input type="checkbox" value="gato" class="filtro-mascota">

                                <span>
                                    Gato
                                </span>

                            </label>

                        </div>


                        <!-- ==========================
              TIPO DE SNACK
        =========================== -->

                        <div class="grupo-filtro">

                            <h3>
                                Tipo de snack
                            </h3>


                            <label class="filtro-opcion">

                                <input type="checkbox" value="premio" class="filtro-tipo">

                                <span>
                                    Treats y premios
                                </span>

                            </label>


                            <label class="filtro-opcion">

                                <input type="checkbox" value="hueso" class="filtro-tipo">

                                <span>
                                    Huesos
                                </span>

                            </label>


                            <label class="filtro-opcion">

                                <input type="checkbox" value="dental" class="filtro-tipo">

                                <span>
                                    Dentales
                                </span>

                            </label>


                            <label class="filtro-opcion">

                                <input type="checkbox" value="deshidratado" class="filtro-tipo">

                                <span>
                                    Deshidratados
                                </span>

                            </label>


                            <label class="filtro-opcion">

                                <input type="checkbox" value="galleta" class="filtro-tipo">

                                <span>
                                    Galletas
                                </span>

                            </label>


                            <label class="filtro-opcion">

                                <input type="checkbox" value="carne" class="filtro-tipo">

                                <span>
                                    Snacks de carne
                                </span>

                            </label>


                            <label class="filtro-opcion">

                                <input type="checkbox" value="otros" class="filtro-tipo">

                                <span>
                                    Otros snacks
                                </span>

                            </label>

                        </div>

                    </div>


                    <div class="filtros-acciones">

                        <button type="button" class="boton-limpiar-filtros" id="limpiarFiltros">

                            Limpiar filtros

                        </button>

                    </div>

                </aside>


                <!-- Fondo oscuro -->

                <div class="fondo-filtros" id="fondoFiltros">
                </div>


                <!--------------------------------
                       CUADRÍCULA
                --------------------------------->

                <div class="productos-grid" id="productosGrid">


                    <!-- Mensaje sin resultados -->
                    <div class="productos-vacios" id="productosVacios">

                        No se encontraron snacks con los filtros seleccionados.

                    </div>

                </div>
        </section>
    </main>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- JavaScript de snacks -->
    <script src="js/snacks.js"></script>

</body>

</html>
