<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accesorios | Aradu Pet</title>

    <link rel="stylesheet" href="css/accesorios.css">

</head>

<body>

    <!-- =====================================
     BOTÓN FLOTANTE REGRESAR AL INICIO
====================================== -->

    <a href="index.html" class="boton-volver-flotante" aria-label="Regresar al inicio" title="Regresar al inicio">

        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>

        </svg>
    </a>

    <main>

        <section class="catalogo-accesorios">

            <div class="catalogo-contenedor">

                <!--------------------------------
                       ENCABEZADO
                --------------------------------->

                <div class="catalogo-encabezado">

                    <h1 class="catalogo-titulo">
                        Accesorios
                    </h1>

                    <p class="catalogo-subtitulo">
                        Encuentra accesorios para el cuidado,
                        comodidad y bienestar de tu mascota perruna o gatuna.
                    </p>

                </div>

                <div class="catalogo-herramientas">

                    <button type="button" class="boton-abrir-filtros" id="abrirFiltros">

                        Filtros

                    </button>

                    <div class="herramientas-derecha">

                        <p class="cantidad-productos" id="cantidadProductos">

                            Cargando accesorios...

                        </p>

                        <select class="ordenar-productos" id="ordenarProductos" aria-label="Ordenar accesorios">

                            <option value="original">
                                Orden predeterminado
                            </option>

                            <option value="az">
                                Alfabéticamente, A-Z
                            </option>

                            <option value="za">
                                Alfabéticamente, Z-A
                            </option>

                        </select>

                    </div>

                </div>


                <!--------------------------------
                     PANEL DE FILTROS
                --------------------------------->

                <aside class="panel-filtros" id="panelFiltros">


                    <!----------------------------
                       ENCABEZADO DEL PANEL
                    ----------------------------->

                    <div class="panel-filtros-encabezado">


                        <div>

                            <h2>
                                Filtrar accesorios
                            </h2>

                            <p>
                                Encuentra lo que necesitas
                            </p>

                        </div>



                        <button type="button" class="boton-cerrar-filtros" id="cerrarFiltros"
                            aria-label="Cerrar filtros">

                            &times;

                        </button>


                    </div>



                    <!----------------------------
                         CONTENIDO FILTROS
                    ----------------------------->

                    <div class="filtros-contenido">


                        <!-------------------------
                               MASCOTA
                        -------------------------->

                        <div class="grupo-filtro">


                            <h3>
                                Mascota
                            </h3>



                            <label class="filtro-opcion">


                                <input type="checkbox" value="perro" class="filtro-mascota">


                                <span>
                                    Perro
                                </span>


                            </label>



                            <label class="filtro-opcion">


                                <input type="checkbox" value="gato" class="filtro-mascota">


                                <span>
                                    Gato
                                </span>


                            </label>


                        </div>



                        <!-------------------------
                          TIPO DE ACCESORIO
                        -------------------------->

                        <div class="grupo-filtro">


                            <h3>
                                Tipo de accesorio
                            </h3>



                            <label class="filtro-opcion">


                                <input type="checkbox" value="collar" class="filtro-tipo">


                                <span>
                                    Collares
                                </span>


                            </label>



                            <label class="filtro-opcion">


                                <input type="checkbox" value="correa" class="filtro-tipo">


                                <span>
                                    Correas
                                </span>


                            </label>



                            <label class="filtro-opcion">


                                <input type="checkbox" value="pechera" class="filtro-tipo">


                                <span>
                                    Pecheras y arneses
                                </span>


                            </label>



                            <label class="filtro-opcion">


                                <input type="checkbox" value="ropa" class="filtro-tipo">


                                <span>
                                    Ropa y medias
                                </span>


                            </label>



                            <label class="filtro-opcion">


                                <input type="checkbox" value="panuelo" class="filtro-tipo">


                                <span>
                                    Pañuelos
                                </span>


                            </label>



                            <label class="filtro-opcion">


                                <input type="checkbox" value="bozal" class="filtro-tipo">


                                <span>
                                    Bozales
                                </span>


                            </label>



                            <label class="filtro-opcion">


                                <input type="checkbox" value="otros" class="filtro-tipo">


                                <span>
                                    Otros accesorios
                                </span>


                            </label>


                        </div>


                    </div>



                    <!----------------------------
                         LIMPIAR FILTROS
                    ----------------------------->

                    <div class="filtros-acciones">


                        <button type="button" class="boton-limpiar-filtros" id="limpiarFiltros">

                            Limpiar filtros

                        </button>


                    </div>


                </aside>



                <!--------------------------------
                       FONDO OSCURO
                --------------------------------->

                <div class="fondo-filtros" id="fondoFiltros">
                </div>




                <!--------------------------------
                       CUADRÍCULA
                --------------------------------->

                <div class="productos-grid" id="productosGrid">

                    
                <!-- =================================
                       MENSAJE SIN RESULTADOS
                ================================== -->

                <div class="productos-vacios" id="productosVacios">

                    <p>
                        No se encontraron productos con los
                        filtros seleccionados.
                    </p>

                </div>


            </div>
            <!-- FIN catalogo-contenedor -->

        </section>


    </main>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- JavaScript de accesorios -->
    <script src="js/accesorios.js"></script>

</body>

</html>
