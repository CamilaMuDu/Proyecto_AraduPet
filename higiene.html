<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Higiene y Bienestar | Aradu Pet</title>

    <link rel="stylesheet" href="css/higiene.css">

</head>

<body>

    <!-- =====================================
     BOTÓN FLOTANTE REGRESAR AL INICIO
====================================== -->

    <a href="index.html" class="boton-volver-flotante" aria-label="Regresar al inicio" title="Regresar al inicio">

        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>

        </svg>
    </a>

    <main>

        <section class="catalogo-higiene">

            <div class="catalogo-contenedor">

                <!--------------------------------
                       ENCABEZADO
                --------------------------------->

                <div class="catalogo-encabezado">

                    <h1 class="catalogo-titulo">
                        Higiene y Bienestar
                    </h1>

                    <p class="catalogo-subtitulo">
                        Encuentra productos para el cuidado, limpieza
                        y bienestar de tu mascota.
                    </p>

                </div>

                <div class="catalogo-herramientas">

                    <button type="button" class="boton-abrir-filtros" id="abrirFiltros">

                        Filtros

                    </button>

                    <div class="herramientas-derecha">

                        <p class="cantidad-productos" id="cantidadProductos">

                            Cargando productos...

                        </p>

                        <select class="ordenar-productos" id="ordenarProductos"
                            aria-label="Ordenar productos de higiene">

                            <option value="original">
                                Orden predeterminado
                            </option>

                            <option value="az">
                                Alfabéticamente, A-Z
                            </option>

                            <option value="za">
                                Alfabéticamente, Z-A
                            </option>

                        </select>

                    </div>

                </div>


                <!-- ================================
        PANEL DE FILTROS
================================= -->

                <aside class="panel-filtros" id="panelFiltros">

                    <div class="panel-filtros-encabezado">

                        <div>

                            <h2>
                                Filtrar productos
                            </h2>

                            <p>
                                Encuentra lo que necesitas
                            </p>

                        </div>

                        <button type="button" class="boton-cerrar-filtros" id="cerrarFiltros"
                            aria-label="Cerrar filtros">

                            &times;

                        </button>

                    </div>


                    <div class="filtros-contenido">


                        <!-- MASCOTA -->

                        <div class="grupo-filtro">

                            <h3>
                                Mascota
                            </h3>


                            <label class="filtro-opcion">

                                <input type="checkbox" value="perro" class="filtro-mascota">

                                <span>
                                    Perro
                                </span>

                            </label>


                            <label class="filtro-opcion">

                                <input type="checkbox" value="gato" class="filtro-mascota">

                                <span>
                                    Gato
                                </span>

                            </label>

                        </div>


                        <!-- TIPO DE PRODUCTO -->

                        <div class="grupo-filtro">

                            <h3>
                                Tipo de producto
                            </h3>


                            <label class="filtro-opcion">

                                <input type="checkbox" value="shampoo" class="filtro-tipo">

                                <span>
                                    Shampoo
                                </span>

                            </label>


                            <label class="filtro-opcion">

                                <input type="checkbox" value="oral" class="filtro-tipo">

                                <span>
                                    Higiene oral
                                </span>

                            </label>


                            <label class="filtro-opcion">

                                <input type="checkbox" value="cepillo" class="filtro-tipo">

                                <span>
                                    Cepillos
                                </span>

                            </label>


                            <label class="filtro-opcion">

                                <input type="checkbox" value="limpieza" class="filtro-tipo">

                                <span>
                                    Toallas y pads
                                </span>

                            </label>


                            <label class="filtro-opcion">

                                <input type="checkbox" value="unas" class="filtro-tipo">

                                <span>
                                    Uñas
                                </span>

                            </label>


                            <label class="filtro-opcion">

                                <input type="checkbox" value="arenero" class="filtro-tipo">

                                <span>
                                    Areneros
                                </span>

                            </label>


                            <label class="filtro-opcion">

                                <input type="checkbox" value="alimentacion" class="filtro-tipo">

                                <span>
                                    Comederos y fuentes
                                </span>

                            </label>


                            <label class="filtro-opcion">

                                <input type="checkbox" value="colonia" class="filtro-tipo">

                                <span>
                                    Colonias
                                </span>

                            </label>


                            <label class="filtro-opcion">

                                <input type="checkbox" value="otros" class="filtro-tipo">

                                <span>
                                    Otros productos
                                </span>

                            </label>

                        </div>

                    </div>


                    <div class="filtros-acciones">

                        <button type="button" class="boton-limpiar-filtros" id="limpiarFiltros">

                            Limpiar filtros

                        </button>

                    </div>

                </aside>


                <div class="fondo-filtros" id="fondoFiltros">
                </div>


                <!--------------------------------
                       CUADRÍCULA
                --------------------------------->

                <div class="productos-grid" id="productosGrid">

                    <!-- Mensaje sin resultados -->
                    <div class="productos-vacios" id="productosVacios">

                        No se encontraron productos con los filtros seleccionados.

                    </div>

                </div>

        </section>

    </main>


    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- JavaScript de higiene -->
    <script src="js/higiene.js"></script>

</body>

</html>
