<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alimentos | Aradu Pet</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/alimentos.css">

</head>

<body>

    <!-- =====================================
     BOTÓN FLOTANTE REGRESAR AL INICIO
====================================== -->

    <a href="index.html" class="boton-volver-flotante" aria-label="Regresar al inicio" title="Regresar al inicio">

        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>

        </svg>
    </a>

    <!--------------------------------
                    ENCABEZADO
                --------------------------------->

    <div class="catalogo-encabezado">

        <h1 class="catalogo-titulo">
            Alimentos para mascotas
        </h1>

        <p class="catalogo-subtitulo">
            Encuentra alimentos para perros y gatos.
        </p>

    </div>


    <!--------------------------------
                    BOTONES PERRO Y GATO
                --------------------------------->

    <div class="filtros-mascota">

        <button type="button" class="boton-mascota activo" data-filtro="perro">

            Perro

        </button>

        <button type="button" class="boton-mascota" data-filtro="gato">

            Gato

        </button>

    </div>


    <!--------------------------------
                    HERRAMIENTAS
                --------------------------------->

    <div class="catalogo-herramientas">

        <button type="button" class="boton-abrir-filtros" id="abrirFiltros">

            Filtros

        </button>

        <div class="herramientas-derecha">

            <p class="cantidad-productos" id="cantidadProductos">

                Cargando productos...

            </p>

            <select class="ordenar-productos" id="ordenarProductos" aria-label="Ordenar productos">

                <option value="original">
                    Orden predeterminado
                </option>

                <option value="az">
                    Alfabéticamente, A-Z
                </option>

                <option value="za">
                    Alfabéticamente, Z-A
                </option>

            </select>

        </div>

    </div>


    <!--------------------------------
        PANEL DE FILTROS
--------------------------------->

    <aside class="panel-filtros" id="panelFiltros">


        <!----------------------------
        ENCABEZADO DEL PANEL
    ----------------------------->

        <div class="panel-filtros-encabezado">


            <div>

                <h2>
                    Filtrar alimentos
                </h2>

                <p>
                    Encuentra lo que necesitas
                </p>

            </div>


            <button type="button" class="boton-cerrar-filtros" id="cerrarFiltros" aria-label="Cerrar filtros">

                &times;

            </button>


        </div>



        <!----------------------------
        CONTENIDO DE FILTROS
    ----------------------------->

        <div class="filtros-contenido">


            <!-------------------------
                MARCA
        -------------------------->

            <div class="grupo-filtro">


                <h3>
                    Marca
                </h3>


                <label class="filtro-opcion">

                    <input type="checkbox" value="nutrisource" class="filtro-marca">

                    <span>
                        NutriSource
                    </span>

                </label>


                <label class="filtro-opcion">

                    <input type="checkbox" value="balance" class="filtro-marca">

                    <span>
                        Balance
                    </span>

                </label>

                <label class="filtro-opcion">

                    <input type="checkbox" value="duketas" class="filtro-marca">

                    <span>
                        Duketas
                    </span>

                </label>

                <label class="filtro-opcion">

                    <input type="checkbox" value="purina" class="filtro-marca">

                    <span>
                        Purina
                    </span>

                </label>

                <label class="filtro-opcion">

                    <input type="checkbox" value="superperro" class="filtro-marca">

                    <span>
                        Super Perro
                    </span>

                </label>

                <label class="filtro-opcion">

                    <input type="checkbox" value="totalnutrition" class="filtro-marca">

                    <span>
                        Total Nutrition
                    </span>

                </label>

                <label class="filtro-opcion">

                    <input type="checkbox" value="maxidog" class="filtro-marca">

                    <span>
                        Maxi Dog
                    </span>

                </label>

                <label class="filtro-opcion">

                    <input type="checkbox" value="1stchoice" class="filtro-marca">

                    <span>
                        1st Choice
                    </span>

                </label>


            </div>



            <!-------------------------
            TIPO DE ALIMENTO
        -------------------------->

            <div class="grupo-filtro">


                <h3>
                    Tipo de alimento
                </h3>


                <label class="filtro-opcion">

                    <input type="checkbox" value="carne" class="filtro-tipo">

                    <span>
                        Carne
                    </span>

                </label>


                <label class="filtro-opcion">

                    <input type="checkbox" value="pienso" class="filtro-tipo">

                    <span>
                        Pienso
                    </span>

                </label>


            </div>



            <!-------------------------
            ETAPA DE VIDA
        -------------------------->

            <div class="grupo-filtro">


                <h3>
                    Etapa de vida
                </h3>


                <label class="filtro-opcion">

                    <input type="checkbox" value="cachorro" class="filtro-etapa">

                    <span>
                        Cachorro
                    </span>

                </label>


                <label class="filtro-opcion">

                    <input type="checkbox" value="adulto" class="filtro-etapa">

                    <span>
                        Adulto
                    </span>

                </label>


                <label class="filtro-opcion">

                    <input type="checkbox" value="adulto-mayor" class="filtro-etapa">

                    <span>
                        Adulto mayor
                    </span>

                </label>


            </div>



            <!-------------------------
            TAMAÑO / RAZA
        -------------------------->

            <div class="grupo-filtro">


                <h3>
                    Tamaño / raza
                </h3>


                <label class="filtro-opcion">

                    <input type="checkbox" value="pequena" class="filtro-raza">

                    <span>
                        Raza pequeña
                    </span>

                </label>


                <label class="filtro-opcion">

                    <input type="checkbox" value="mediana" class="filtro-raza">

                    <span>
                        Raza mediana
                    </span>

                </label>


                <label class="filtro-opcion">

                    <input type="checkbox" value="grande" class="filtro-raza">

                    <span>
                        Raza grande
                    </span>

                </label>


            </div>



            <!-------------------------
                SABOR
        -------------------------->

            <div class="grupo-filtro">


                <h3>
                    Sabor
                </h3>


                <label class="filtro-opcion">

                    <input type="checkbox" value="pollo" class="filtro-sabor">

                    <span>
                        Pollo
                    </span>

                </label>


                <label class="filtro-opcion">

                    <input type="checkbox" value="cordero" class="filtro-sabor">

                    <span>
                        Cordero
                    </span>

                </label>


                <label class="filtro-opcion">

                    <input type="checkbox" value="salmon" class="filtro-sabor">

                    <span>
                        Salmón
                    </span>

                </label>


                <label class="filtro-opcion">

                    <input type="checkbox" value="res" class="filtro-sabor">

                    <span>
                        Res
                    </span>

                </label>


            </div>


        </div>



        <!----------------------------
        LIMPIAR FILTROS
    ----------------------------->

        <div class="filtros-acciones">


            <button type="button" class="boton-limpiar-filtros" id="limpiarFiltros">

                Limpiar filtros

            </button>


        </div>


    </aside>


    <!-- Fondo oscuro al abrir filtros -->
    <div class="fondo-filtros" id="fondoFiltros">
    </div>


    <!--------------------------------
                    PRODUCTOS
                --------------------------------->

    <div class="productos-grid" id="productosGrid">



    <!-- Sin resultados -->
    <div class="productos-vacios" id="productosVacios">

        No se encontraron productos con los filtros seleccionados.

    </div>

    </div>

    </section>

    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="js/alimentos.js"></script>

</body>

</html>
